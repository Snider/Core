# Local implementation of auto-merge to handle environments where .git is missing.
# The reusable workflow fails because 'gh' requires repository context which is
# missing when called without a checkout or explicit --repo flag.
name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Auto Merge
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const association = context.payload.pull_request.author_association;

            // Trusted bot accounts (act as org members)
            const trustedBots = ['google-labs-jules[bot]', 'github-actions[bot]'];
            const isTrustedBot = trustedBots.includes(author);

            // Check author association
            const trusted = ['MEMBER', 'OWNER', 'COLLABORATOR'];
            if (!isTrustedBot && !trusted.includes(association)) {
              core.info(`${author} is ${association} — skipping auto-merge`);
              return;
            }

            await exec.exec('gh', [
              'pr', 'merge', process.env.PR_NUMBER,
              '--auto',
              '--merge',
              '--repo', context.repo.owner + '/' + context.repo.repo
            ]);
            core.info(`Auto-merge enabled for #${process.env.PR_NUMBER}`);
